name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # 集成测试有两个 Prisma client 各自定库，二者必须指向同一个 schema-完整库：
      #   - 测试自建的 testDb 读 DATABASE_URL；
      #   - app 的 @/lib/db 读 getTowerDbPath() = $TOWER_DATA_DIR/database/tower.db（不读 DATABASE_URL）。
      # 故把两者对齐到同一文件。
      TOWER_DATA_DIR: "${{ github.workspace }}/.tower-ci"
      DATABASE_URL: "file:${{ github.workspace }}/.tower-ci/database/tower.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `prisma generate` + native node-pty build.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up test database
        # 直接调 prisma/tsx，让它们用 job 的 DATABASE_URL（= app db 派生的同一文件）。
        # 不走 pnpm db:push / db:init-fts —— 那两个脚本把 DATABASE_URL 硬编码成本地 ~/.tower-dev。
        run: |
          mkdir -p "$TOWER_DATA_DIR/database"
          pnpm exec prisma db push --skip-generate --accept-data-loss
          pnpm exec tsx prisma/init-fts.ts

      - name: Build AI SDK and Qwen Code extension fixtures
        run: |
          pnpm --filter @tower/ai-sdk build
          pnpm --filter tower-extension-qwen-code build

      - name: Test
        run: pnpm test:run

  catalog:
    name: extension catalog
    runs-on: ubuntu-latest
    env:
      CATALOG_OUTPUT_DIR: "${{ runner.temp }}/tower-extension-catalog"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build catalog runtime and Qwen Code extension
        run: |
          pnpm --filter @tower/ai-sdk build
          pnpm --filter @tower/ai-runtime build
          pnpm --filter tower-extension-qwen-code build

      - name: Generate extension catalog
        run: >-
          pnpm exec tsx scripts/build-extension-catalog.ts
          --base-url https://catalog.example.test/ci/
          --output "$CATALOG_OUTPUT_DIR"

      - name: Validate catalog with runtime
        run: pnpm extensions:catalog:validate -- --input "$CATALOG_OUTPUT_DIR"

      - name: Retain generated catalog
        uses: actions/upload-artifact@v4
        with:
          name: tower-extension-catalog-${{ github.sha }}
          path: ${{ env.CATALOG_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 7
