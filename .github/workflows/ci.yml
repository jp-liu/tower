name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Tests hit a real SQLite file (preview-actions / search / fts suites).
      DATABASE_URL: "file:./prisma/ci.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `prisma generate` + native node-pty build.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up test database
        # 直接调 prisma/tsx，让它们用 job 的 DATABASE_URL(ci.db)。
        # 不走 pnpm db:push / db:init-fts —— 那两个脚本把 DATABASE_URL 硬编码成本地 ~/.tower-dev，
        # 会把 schema 建到别处，导致测试读的 ci.db 空表(P2021)。
        run: |
          pnpm exec prisma db push --skip-generate --accept-data-loss
          pnpm exec tsx prisma/init-fts.ts

      - name: Test
        run: pnpm test:run
